AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sakhi UDK live detection service (api.py) on ONE GPU: English + custom UDK + Hindi + Telugu/Tamil/Kannada.
  Same shape as sakhi-udk (CPU): EC2 + EIP, SSM administration (no SSH), Caddy HTTPS at <EIP>.sslip.io, the
  app arriving with deploy/aws_deploy.py (UDK_APP_STACK=sakhi-udk-gpu). Differences: a GPU instance on the AWS
  Deep Learning Base AMI (NVIDIA driver, Docker, NVIDIA Container Toolkit), its own config parameter, and read
  access to the Hugging Face token (the multilingual models are private / gated and are baked in at build).
  Sizing (measured 2026-10-07, finalised system, Kaggle T4): 11.9 GB GPU peak with UDK_TEXT_MODELS_DEVICE=cpu,
  5.4 GB RAM, ~1.5-1.9 s per speech segment (0.21-0.23 s of work per second of speech) for one journey.
  Needs the "Running On-Demand G and VT instances" vCPU quota >= 4 in the region.
  Do not update this stack casually: the AmiId parameter re-resolves on every update, and a new AMI replaces
  the instance, and with it the /data volume that holds the encryption keys.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing public subnet with an Internet Gateway route
  InstanceType:
    Type: String
    Default: g4dn.xlarge
    AllowedValues: [g4dn.xlarge, g4dn.2xlarge, g5.xlarge, g5.2xlarge, g6.xlarge, g6.2xlarge]
    Description: >-
      g4dn.xlarge = 1x T4 16 GB, 4 vCPU, 16 GB RAM (what was measured). g5 = A10G 24 GB, g6 = L4 24 GB: more headroom.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id
  ConfigParameter:
    Type: String
    Default: /sakhi/udk-gpu/config
    AllowedPattern: "^/sakhi/[a-z0-9/-]+$"
  HfTokenParameter:
    Type: String
    Default: /sakhi/udk/hf-token
    AllowedPattern: "^/sakhi/[a-z0-9/-]+$"
Resources:
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: SakhiUdkGpuRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ConfigParameter}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${HfTokenParameter}"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"
      Tags: [{ Key: Application, Value: Sakhi }]
  AppProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref AppRole] }
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS and ACME only; use SSM, no SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "AWS APIs, GitHub, PyPI, Hugging Face, Docker Hub, ACME" }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "Ubuntu package repositories" }
      Tags: [{ Key: Application, Value: Sakhi }]
  Address:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc, Tags: [{ Key: Application, Value: Sakhi }, { Key: Name, Value: sakhi-udk-gpu }] }
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref AppProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref WebSecurityGroup]
      MetadataOptions:
        { HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          # ~25 GB image (all models baked in) + build layers + /data (holds the encryption keys: snapshot it)
          Ebs: { VolumeSize: 150, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: sakhi-udk-gpu }, { Key: Application, Value: Sakhi }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # The Deep Learning Base AMI ships the NVIDIA driver, Docker and the NVIDIA Container Toolkit;
          # install only what is missing.
          command -v docker || { apt-get update; apt-get install -y docker.io; }
          docker buildx version || { apt-get update; apt-get install -y docker-buildx-plugin || apt-get install -y docker-buildx; }
          command -v aws || snap install aws-cli --classic
          systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service \
            || systemctl enable --now amazon-ssm-agent.service \
            || snap install amazon-ssm-agent --classic
          nvidia-smi -L
          docker run --rm --gpus all ubuntu:22.04 nvidia-smi -L   # the container toolkit sees the GPU
          install -d -m 700 /etc/udk
          echo '${ConfigParameter}' > /etc/udk/config-param       # read by deploy/remote_deploy.sh
          aws ssm get-parameter --region ${AWS::Region} --name ${ConfigParameter} --with-decryption --query Parameter.Value --output text | cat > /etc/udk/udk.env
          chmod 600 /etc/udk/udk.env
          printf '%s.sslip.io {\n\treverse_proxy udk:8000\n}\n' '${Address}' > /etc/udk/Caddyfile
          docker network create udk
          docker run -d --name caddy --network udk --restart unless-stopped -p 80:80 -p 443:443 \
            -v caddy-data:/data -v /etc/udk/Caddyfile:/etc/caddy/Caddyfile:ro --log-opt max-size=10m caddy:2
          touch /etc/udk/bootstrap-complete
  AddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      { AllocationId: !GetAtt Address.AllocationId, InstanceId: !Ref AppInstance }
Outputs:
  InstanceId: { Value: !Ref AppInstance }
  InstanceRoleName: { Value: !Ref AppRole }
  PublicIp: { Value: !Ref Address }
  Endpoint: { Value: !Sub "https://${Address}.sslip.io" }
